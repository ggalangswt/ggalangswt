<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="30%" stop-color="#1a1040"/>
      <stop offset="60%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.25"/>
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="100" x2="0" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm"><rect width="1200" height="220" fill="url(#fade)"/></mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-width="0.3" stroke-opacity="0.12"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip to reveal subtitle left to right -->
    <clipPath id="textReveal">
      <rect x="270" y="120" width="0" height="40">
        <animate attributeName="width" values="0;660;660;660;0" keyTimes="0;0.4;0.85;0.9;1" dur="6s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
  </defs>

  <!-- Base -->
  <rect width="1200" height="220" fill="url(#g1)"/>
  <rect width="1200" height="220" fill="url(#grid)" mask="url(#fm)"/>
  <rect width="1200" height="220" fill="url(#g2)"/>

  <!-- Scan lines -->
  <line x1="60" y1="35" x2="440" y2="35" stroke="#8B5CF6" stroke-opacity="0.1" stroke-width="0.5"/>
  <line x1="760" y1="35" x2="1140" y2="35" stroke="#8B5CF6" stroke-opacity="0.07" stroke-width="0.5"/>
  <line x1="200" y1="185" x2="1000" y2="185" stroke="#6D28D9" stroke-opacity="0.05" stroke-width="0.5"/>

  <!-- Accent dots -->
  <circle cx="80" cy="35" r="2" fill="#8B5CF6" opacity="0.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="420" cy="35" r="1.5" fill="#8B5CF6" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="780" cy="35" r="1.5" fill="#A78BFA" opacity="0.25">
    <animate attributeName="opacity" values="0.25;0.08;0.25" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1120" cy="35" r="2" fill="#8B5CF6" opacity="0.4" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Data stream -->
  <rect x="130" y="33" width="20" height="1" fill="#8B5CF6" opacity="0.25">
    <animate attributeName="x" values="130;150;130" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="950" y="33" width="14" height="1" fill="#A78BFA" opacity="0.18">
    <animate attributeName="x" values="950;964;950" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <path d="M 24 20 L 24 12 L 32 12" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.25" fill="none"/>
  <path d="M 1176 20 L 1176 12 L 1168 12" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.25" fill="none"/>
  <path d="M 24 200 L 24 208 L 32 208" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.15" fill="none"/>
  <path d="M 1176 200 L 1176 208 L 1168 208" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.15" fill="none"/>

  <!-- Name -->
  <text x="600" y="105" font-family="'Segoe UI', system-ui, -apple-system, sans-serif" font-size="48" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="2">Galang Swastika</text>

  <!-- Subtitle (typed by cursor) -->
  <g clip-path="url(#textReveal)">
    <text x="600" y="145" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="14" text-anchor="middle" letter-spacing="3">
      <tspan fill="#8B5CF6">Frontend Developer</tspan>
      <tspan fill="#484f58">  ·  </tspan>
      <tspan fill="#8b949e">IT Student @ UGM</tspan>
      <tspan fill="#484f58">  ·  </tspan>
      <tspan fill="#8B5CF6">Web3 Explorer</tspan>
    </text>
  </g>

  <!-- Cursor moves with text reveal -->
  <rect y="132" width="2" height="16" fill="#8B5CF6">
    <animate attributeName="x" values="270;930;930;930;270" keyTimes="0;0.4;0.85;0.9;1" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0;1" dur="0.8s" repeatCount="indefinite"/>
  </rect>
</svg>
