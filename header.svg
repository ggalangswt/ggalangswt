<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="160" viewBox="0 0 1200 160" fill="none">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1200" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="30%" stop-color="#1a1040"/>
      <stop offset="60%" stop-color="#2d1b69"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0"/>
      <stop offset="20%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#6D28D9" stop-opacity="0.3"/>
      <stop offset="80%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="80" x2="0" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="1"/>
      <stop offset="100%" stop-color="white" stop-opacity="0"/>
    </linearGradient>
    <mask id="fm"><rect width="1200" height="160" fill="url(#fade)"/></mask>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#8B5CF6" stroke-width="0.3" stroke-opacity="0.15"/>
    </pattern>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Base -->
  <rect width="1200" height="160" fill="url(#g1)"/>

  <!-- Grid overlay fading down -->
  <rect width="1200" height="160" fill="url(#grid)" mask="url(#fm)"/>

  <!-- Gradient glow band -->
  <rect width="1200" height="160" fill="url(#g2)"/>

  <!-- Horizontal scan lines -->
  <line x1="80" y1="45" x2="500" y2="45" stroke="#8B5CF6" stroke-opacity="0.12" stroke-width="0.5"/>
  <line x1="700" y1="45" x2="1120" y2="45" stroke="#8B5CF6" stroke-opacity="0.08" stroke-width="0.5"/>
  <line x1="200" y1="85" x2="1000" y2="85" stroke="#6D28D9" stroke-opacity="0.06" stroke-width="0.5"/>

  <!-- Accent dots -->
  <circle cx="100" cy="45" r="2" fill="#8B5CF6" opacity="0.5" filter="url(#glow)">
    <animate attributeName="opacity" values="0.5;0.2;0.5" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="480" cy="45" r="1.5" fill="#8B5CF6" opacity="0.4">
    <animate attributeName="opacity" values="0.4;0.1;0.4" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="720" cy="45" r="1.5" fill="#A78BFA" opacity="0.3">
    <animate attributeName="opacity" values="0.3;0.1;0.3" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="45" r="2" fill="#8B5CF6" opacity="0.4" filter="url(#glow)">
    <animate attributeName="opacity" values="0.4;0.15;0.4" dur="3.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Data stream accents -->
  <rect x="150" y="42" width="24" height="1" fill="#8B5CF6" opacity="0.3">
    <animate attributeName="x" values="150;174;150" dur="5s" repeatCount="indefinite"/>
  </rect>
  <rect x="900" y="42" width="16" height="1" fill="#A78BFA" opacity="0.2">
    <animate attributeName="x" values="900;916;900" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- Corner brackets -->
  <path d="M 30 25 L 30 15 L 40 15" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" fill="none"/>
  <path d="M 1170 25 L 1170 15 L 1160 15" stroke="#8B5CF6" stroke-width="1" stroke-opacity="0.3" fill="none"/>

  <!-- Bottom fade to transparent -->
  <rect width="1200" height="40" y="120" fill="url(#g1)" opacity="0.5"/>
</svg>
