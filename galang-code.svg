    <tspan fill="#a5d6ff">"TS"</tspan>
    <tspan fill="#c9d1d9">, </tspan>
    <tspan fill="#a5d6ff">"Solidity"</tspan>
    <tspan fill="#c9d1d9">],</tspan>
  </text>

