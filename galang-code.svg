  <text x="60" y="340" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="13">
    <tspan fill="#ff7b72">export default</tspan>
    <tspan fill="#c9d1d9"> galang;</tspan>
    <tspan fill="#8b949e">  // ship it 🚀</tspan>
  </text>

  <!-- Cursor blink -->
  <rect x="232" y="328" width="2" height="16" fill="#8B5CF6">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
