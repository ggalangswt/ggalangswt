  <text x="60" y="244" font-family="JetBrains Mono, SF Mono, Consolas, monospace" font-size="13">
    <tspan fill="#c9d1d9">    </tspan>
    <tspan fill="#79c0ff">passion</tspan>
    <tspan fill="#c9d1d9">:    </tspan>
    <tspan fill="#a5d6ff">"crafting interfaces that feel alive"</tspan>
